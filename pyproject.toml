[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextorch-ai"
version = "0.1.0"
description = "Neural synthesis, latent computation and proof-gated expert iteration for PyTorch and Orange"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "z3-solver>=4.13,<5"]

[project.optional-dependencies]
orange = ["Orange3>=3.38,<4", "PyQt6>=6.7,<7", "pyqtgraph>=0.13"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1"]
umap = ["umap-learn>=0.5,<1"]
gpu = ["triton>=3; platform_system == 'Linux'"]

[project.scripts]
nextorch = "nextorch.__main__:main"

[project.entry-points."orange.widgets"]
"Nextorch Epistemic AI" = "nextorch.orange"

[tool.setuptools.packages.find]
include = ["nextorch*"]

[tool.setuptools.package-data]
"nextorch.orange" = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["orange: Orange/Qt integration", "lean: Lean executable integration", "gpu: CUDA/Triton integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
